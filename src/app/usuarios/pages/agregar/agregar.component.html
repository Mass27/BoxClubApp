<form
  [formGroup]="formulario"
  class="relative bg-white rounded-2xl shadow-xl p-8 max-w-5xl mx-auto space-y-8"
>
  <!-- Encabezado -->
  <div class="text-center">
    <h2 class="text-3xl font-bold text-red-600">
      {{ usuarioId ? "Editar Cliente" : "Registrar Cliente" }}
    </h2>
    <p class="text-gray-500">Llena los datos del cliente para continuar</p>
  </div>

  <!-- Imagen -->
  <div class="flex justify-center">
    <label for="imagen" class="relative cursor-pointer group">
      <div class="w-32 h-32 bg-gray-100 border-2 border-dashed rounded-full flex items-center justify-center shadow-inner overflow-hidden">
        <img
          *ngIf="currentImageUrl"
          [src]="currentImageUrl"
          class="w-full h-full object-cover"
          alt="Imagen actual"
        />
        <svg
          *ngIf="!currentImageUrl"
          class="w-10 h-10 text-gray-400 group-hover:text-red-500 transition"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M5 12h14M12 5l7 7-7 7"
          />
        </svg>
      </div>
      <input type="file" id="imagen" (change)="onFileChange($event)" class="hidden" />
      <span class="block text-sm text-center text-red-500 mt-2 group-hover:underline"
        >Cambiar Imagen</span
      >
    </label>
  </div>

  <!-- Campos en grid -->
  <div class="grid md:grid-cols-2 gap-6 text-sm">
    <!-- Nombre -->
    <div>
      <label class="block mb-1 font-semibold text-gray-700"
        >Nombre Completo <span class="text-red-500">*</span></label
      >
      <input
        formControlName="nombreCompleto"
        maxlength="50"
        placeholder="Ej: Juan Pérez"
        class="w-full rounded-lg border border-gray-300 px-4 py-2 bg-gray-50 focus:ring-2 focus:ring-red-400 outline-none"
        type="text"
      />
    </div>

    <!-- Teléfono -->
    <div>
      <label class="block mb-1 font-semibold text-gray-700"
        >Número de Teléfono <span class="text-red-500">*</span></label
      >
      <input
        formControlName="numeroTelefono"
        (input)="limitarNumeroTelefono($event)"
        type="text"
        placeholder="Ej: 99998888"
        class="w-full rounded-lg border border-gray-300 px-4 py-2 bg-gray-50 focus:ring-2 focus:ring-red-400 outline-none"
      />
    </div>

    <!-- Fecha de ingreso -->
    <div>
      <label class="block mb-1 font-semibold text-gray-700"
        >Fecha de Ingreso <span class="text-red-500">*</span></label
      >
      <input
        formControlName="fechaIngreso"
        type="date"
        class="w-full rounded-lg border border-gray-300 px-4 py-2 bg-gray-50 focus:ring-2 focus:ring-red-400 outline-none"
      />
    </div>

    <!-- Correo -->
    <div>
      <label class="block mb-1 font-semibold text-gray-700"
        >Correo <span class="text-red-500">*</span></label
      >
      <input
        formControlName="correo"
        type="email"
        placeholder="Ej: correo@ejemplo.com"
        class="w-full rounded-lg border border-gray-300 px-4 py-2 bg-gray-50 focus:ring-2 focus:ring-red-400 outline-none"
      />
    </div>

    <!-- Identidad -->
    <div>
      <label class="block mb-1 font-semibold text-gray-700"
        >Identidad <span class="text-red-500">*</span></label
      >
      <input
        formControlName="identidad"
        type="text"
        maxlength="13"
        (input)="limitarIdentidad($event)"
        placeholder="Ej: 0801199912345"
        class="w-full rounded-lg border border-gray-300 px-4 py-2 bg-gray-50 focus:ring-2 focus:ring-red-400 outline-none"
      />
    </div>

    <!-- Plan -->
    <div>
      <label class="block mb-1 font-semibold text-gray-700"
        >Plan <span class="text-red-500">*</span></label
      >
      <select
        formControlName="idPlan"
        class="w-full rounded-lg border border-gray-300 px-4 py-2 bg-gray-50 focus:ring-2 focus:ring-red-400 outline-none"
      >
        <option disabled selected>Selecciona un plan</option>
        <option *ngFor="let plan of tipoPlanes" [value]="plan._id">
          {{ plan.nombrePlan }}
        </option>
      </select>
    </div>

    <!-- Estado -->
    <div>
      <label class="block mb-1 font-semibold text-gray-700">Estado</label>
      <select
        formControlName="estado"
        class="w-full rounded-lg border border-gray-300 px-4 py-2 bg-gray-50 focus:ring-2 focus:ring-red-400 outline-none"
      >
        <option disabled selected>Selecciona un estado</option>
        <option *ngFor="let plan of estados" [value]="plan.id">
          {{ plan.desc }}
        </option>
      </select>
    </div>
  </div>

  <!-- Botón -->
  <div class="pt-4">
    <button
      type="submit"
      (click)="enviarFormulario()"
      class="w-full bg-gradient-to-r from-red-500 to-red-700 text-white py-3 rounded-xl text-lg font-semibold shadow-lg hover:from-red-600 hover:to-red-800 transition"
    >
      Guardar Cliente
    </button>
  </div>
</form>
