<div class="bg-white p-6 rounded-xl max-w-md mx-auto shadow-lg">
  <!-- Header con nuevo estilo -->
  <div class="text-center mb-8">
    <h2 class="text-2xl font-bold text-gray-800">
      Seleccionar Rutina
      <div class="h-1 w-24 bg-red-600 mx-auto mt-2 rounded-full"></div>
    </h2>
  </div>

  <!-- Rutinas Asignadas con nuevo diseño -->
  <div *ngIf="rutinasAsignadas?.length" class="mb-8">
    <h3 class="text-lg font-semibold text-gray-700 mb-4 flex items-center">
      <span class="material-icons mr-2 text-red-600">assignment</span>
      <span>Rutinas Asignadas</span>
      <span class="ml-2 bg-blue-100 text-red-800 text-xs font-medium px-3 py-1 rounded-full">
        {{rutinasAsignadas.length}}
      </span>
    </h3>

    <ul class="space-y-3">
      <li *ngFor="let rutina of rutinasAsignadas"
          class="flex items-center justify-between bg-gray-50 rounded-lg px-4 py-3 hover:bg-blue-50 transition-all duration-200 group border border-gray-100">
        <div class="flex items-center">
          <span class="material-icons text-red-500 mr-3">fitness_center</span>
          <span class="text-base text-gray-700 font-medium">{{ rutina.nombre }}</span>
        </div>
        <button (click)="eliminarRutina(rutina._id)"
                class="opacity-0 group-hover:opacity-100 bg-red-50 text-red-500 hover:bg-red-100 hover:text-red-600 px-4 py-1.5 rounded-lg text-sm font-medium transition-all duration-200 flex items-center">
          <span class="material-icons text-sm mr-1">delete</span>
          Eliminar
        </button>
      </li>
    </ul>
  </div>

  <!-- Selector de Rutina mejorado -->
  <div class="mb-8">
    <mat-form-field  class="w-full">
      <mat-label class="text-gray-600">
        <span class="flex items-center">
          <span class="material-icons mr-2 text-red-500">add_circle</span>
          Selecciona una rutina nueva
        </span>
      </mat-label>
      <mat-select [(value)]="rutinaSeleccionada" class="text-gray-700">
        <mat-option *ngFor="let rutina of rutinas" [value]="rutina._id">
          <div class="flex items-center py-2 px-1">
            <!-- <span class="material-icons text-blue-500 mr-3">fitness_center</span> -->
            <span class="font-medium">{{ rutina.nombre }}</span>
          </div>
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <!-- Botones de Acción mejorados -->
  <div class="flex justify-end space-x-4 pt-4 border-t">
    <button
      mat-button
      (click)="cerrar()"
      class="px-6 py-2.5 bg-gray-100 text-gray-700 font-medium rounded-lg hover:bg-gray-200 transition-all duration-200 flex items-center">
      <span class="material-icons mr-2">close</span>
      Cancelar
    </button>
    <button
      mat-button
      (click)="asignarRutina()"
      [disabled]="!rutinaSeleccionada"
      class="px-6 py-2.5 bg-red-600 text-white font-medium rounded-lg hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 flex items-center shadow-lg hover:shadow-xl">
      <span class="material-icons mr-2">add_circle</span>
      Asignar
    </button>
  </div>
</div>
