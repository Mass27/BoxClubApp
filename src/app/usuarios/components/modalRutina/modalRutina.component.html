<div class="bg-white p-8 rounded-2xl shadow-xl max-w-lg mx-auto">

  <div class="text-center mb-6">
    <h2 class="text-3xl font-semibold text-gray-800">Seleccionar Rutina</h2>
    <div class="mt-2 h-0.5 bg-red-600 w-16 mx-auto rounded-full"></div>
  </div>


  <div *ngIf="rutinasAsignadas?.length" class="mb-6">
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center text-gray-700">
        <span class="material-icons text-red-600 mr-2">assignment</span>
        <h3 class="text-lg font-medium">Rutinas Asignadas</h3>
      </div>
      <span class="bg-red-100 text-red-600 text-sm font-semibold px-3 py-1 rounded-full">
        {{ rutinasAsignadas.length }}
      </span>
    </div>


    <div class="max-h-48 overflow-y-auto space-y-2">
      <ul>
        <li *ngFor="let rutina of rutinasAsignadas"
            class="group flex items-center justify-between bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 hover:bg-gray-100 transition duration-200">
          <div class="flex items-center">
            <span class="material-icons text-red-500 mr-3">fitness_center</span>
            <span class="text-gray-800 font-medium">{{ rutina.nombre }}</span>
          </div>
          <button (click)="eliminarRutina(rutina._id)"
                  class="opacity-0 group-hover:opacity-100 bg-red-50 text-red-500 hover:bg-red-100 hover:text-red-600 px-3 py-1 rounded-md text-sm font-medium transition">
            <span class="material-icons text-sm mr-1">delete</span>
            Eliminar
          </button>
        </li>
      </ul>
    </div>
  </div>


  <div class="mb-6">
    <mat-form-field appearance="fill" class="w-full">
      <mat-label class="text-gray-600 flex items-center">
        <span class="material-icons text-red-500 mr-2">add_circle</span>
        Selecciona una rutina nueva
      </mat-label>
      <mat-select [(value)]="rutinaSeleccionada" class="text-gray-700">
        <mat-option *ngFor="let rutina of rutinas" [value]="rutina._id">
          <div class="flex items-center py-2">
            <span class="font-medium">{{ rutina.nombre }}</span>
          </div>
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>


  <div class="flex justify-end space-x-4 pt-6 border-t border-gray-200">
    <button mat-button (click)="cerrar()"
            class="px-5 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition flex items-center">
      <span class="material-icons mr-2">close</span>
      Cancelar
    </button>
    <button mat-button (click)="asignarRutina()" [disabled]="!rutinaSeleccionada"
            class="px-5 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed transition flex items-center shadow-md">
      <span class="material-icons mr-2">add_circle</span>
      Asignar
    </button>
  </div>
</div>
