<div class="min-h-screen bg-gray-100 py-10 px-4 flex justify-center items-start">
  <div class="w-full max-w-4xl bg-white rounded-3xl shadow-xl p-10 relative overflow-hidden">


    <div class="text-center mb-10">
      <h2 class="text-4xl font-extrabold text-red-600 tracking-tight">
        {{ prodId ? 'Editar Producto' : 'Registrar Nuevo Producto' }}
      </h2>
      <p class="text-gray-600 mt-2 text-lg">Completa la información del producto</p>
    </div>


    <form [formGroup]="formulario" class="grid grid-cols-1 md:grid-cols-2 gap-8 text-base">


      <div>
        <label for="nombreProducto" class="block text-gray-700 font-semibold mb-1">
          Nombre del Producto <span class="text-red-500">*</span>
        </label>
        <input
          formControlName="nombreProducto"
          id="nombreProducto"
          type="text"
          placeholder="Ej: Suplemento Xtreme"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-red-400"
        />
        <div *ngIf="formulario.get('nombreProducto')?.invalid && formulario.get('nombreProducto')?.touched">
          <small class="text-red-500">Campo obligatorio.</small>
        </div>
      </div>

  
      <div>
        <label for="precio" class="block text-gray-700 font-semibold mb-1">
          Precio <span class="text-red-500">*</span>
        </label>
        <input
          formControlName="precio"
          id="precio"
          type="number"
          (input)="limitadorNegayMax($event)"
          placeholder="Ej: 500"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-red-400"
        />
        <div *ngIf="formulario.get('precio')?.invalid && formulario.get('precio')?.touched">
          <small class="text-red-500">Campo obligatorio.</small>
        </div>
      </div>

   
      <div>
        <label for="cantidadEnStock" class="block text-gray-700 font-semibold mb-1">
          Cantidad en Stock <span class="text-red-500">*</span>
        </label>
        <input
          formControlName="cantidadEnStock"
          id="cantidadEnStock"
          type="number"
          (input)="limitadorNegayMax($event)"
          placeholder="Ej: 150"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-red-400"
        />
        <div *ngIf="formulario.get('cantidadEnStock')?.invalid && formulario.get('cantidadEnStock')?.touched">
          <small class="text-red-500">Campo obligatorio.</small>
        </div>
      </div>


      <div>
        <label for="descripcion" class="block text-gray-700 font-semibold mb-1">
          Descripción <span class="text-red-500">*</span>
        </label>
        <textarea
          formControlName="descripcion"
          id="descripcion"
          rows="3"
          placeholder="Breve descripción del producto"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 resize-none focus:outline-none focus:ring-2 focus:ring-red-400"
        ></textarea>
        <div *ngIf="formulario.get('descripcion')?.invalid && formulario.get('descripcion')?.touched">
          <small class="text-red-500">Campo obligatorio.</small>
        </div>
      </div>
    </form>

   
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mt-8">
      <div>
        <label for="imagen" class="block text-gray-700 font-semibold mb-1">Subir Imagen</label>
        <input
          type="file"
          id="imagen"
          (change)="onFileChange($event)"
          class="block w-full text-gray-600 text-base file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-red-50 file:text-red-700 hover:file:bg-red-100 transition"
        />
      </div>
      <div *ngIf="currentImageUrl" class="flex flex-col items-center justify-center">
        <span class="text-sm text-gray-500 mb-1">Imagen actual</span>
        <img
          [src]="currentImageUrl"
          alt="Imagen del producto"
          class="w-28 h-28 object-cover rounded-full border-4 border-red-200 shadow-md"
        />
      </div>
    </div>


    <div class="text-center mt-10">
      <button
        type="submit"
        (click)="enviarFormulario()"
        class="w-full md:w-auto px-10 py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-full shadow-lg text-lg transition-transform transform hover:scale-105"
      >
        {{ prodId ? 'Actualizar Producto' : 'Guardar Producto' }}
      </button>
    </div>
  </div>
</div>
