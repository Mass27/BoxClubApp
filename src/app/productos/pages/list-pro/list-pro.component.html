<h2 class="titulo-global">Listado de Productos</h2>


<div class="search-container">
<app-search-box
  (buscarProductoNombre)="buscarProductoPorNombre($event)"
  class="app-search-box"
></app-search-box>
<button class="button-agregar" *ngIf="isAdmin" routerLink="/productos/agregar">
  <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
  </svg>Agregar</button>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mt-8">
  <div *ngFor="let item of prodFiltrados" class="bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-lg transition-shadow duration-300">

    <!-- Imagen del producto -->
    <img [src]="item.imagen" alt="{{item.nombreProducto}}" class="w-full h-48 object-cover" />

    <!-- Contenido de la card -->
    <div class="p-5 space-y-2">
      <h2 class="text-xl font-semibold text-gray-800">{{ item.nombreProducto }}</h2>

      <p class="text-sm text-gray-600">
        <strong class="text-gray-700">Descripción:</strong> {{ item.descripcion }}
      </p>

      <p class="text-sm text-gray-600">
        <strong class="text-gray-700">Precio:</strong> L {{ item.precio }}
      </p>


      <p class="text-sm text-gray-600">
        <strong class="text-gray-700">Stock:</strong> {{ item.cantidadEnStock }}
      </p>

      <button
        *ngIf="isAdmin"
        [routerLink]="['/productos/edit', item._id]"
        class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-4 rounded-lg transition-colors duration-300">
        Editar Producto
      </button>
    </div>

  </div>
</div>
