<div class="min-h-screen flex bg-gray-100">


  <div class="flex-1 flex flex-col">

   <div class="mb-8 flex flex-col md:flex-row items-center justify-between gap-4">
    <h2 class="text-3xl font-bold text-red-600 flex items-center gap-2">
      <svg class="w-7 h-7 text-red-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
      </svg>
      Panel de Planes
    </h2>

    <div class="flex flex-col sm:flex-row gap-4 w-full sm:w-auto">
      <app-searchBox
        (BuscarObject)="buscarProductoPorNombre($event)"
        class="flex-1 sm:flex-none"
      ></app-searchBox>

      <button
        *ngIf="isAdmin"
        routerLink="/productos/agregar"
        class="bg-red-500 hover:bg-red-600 text-white px-5 py-2 rounded-lg flex items-center gap-2 transition"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
        Agregar
      </button>
    </div>
  </div>

    <!-- Metrics Block -->
    <div class="bg-gray-50 p-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <div class="bg-white rounded-lg shadow p-4 flex items-center">
        <div class="p-2 bg-red-100 text-red-600 rounded-full">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h18v18H3V3z" />
          </svg>
        </div>
        <div class="ml-3">
          <p class="text-sm text-gray-500">Total Productos</p>
          <p class="text-xl font-bold text-gray-800">{{ totalProductos }}</p>
        </div>
      </div>
      <div class="bg-white rounded-lg shadow p-4 flex items-center">
        <div class="p-2 bg-green-100 text-green-600 rounded-full">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3" />
          </svg>
        </div>
        <div class="ml-3">
          <p class="text-sm text-gray-500">Productos Activos</p>
          <p class="text-xl font-bold text-gray-800">{{ activosCount }}</p>
        </div>
      </div>
      <div class="bg-white rounded-lg shadow p-4 flex items-center">
        <div class="p-2 bg-blue-100 text-blue-600 rounded-full">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M3 14h18M5 6h14v12H5z" />
          </svg>
        </div>
        <div class="ml-3">
          <p class="text-sm text-gray-500">Sin Stock</p>
          <p class="text-xl font-bold text-gray-800">{{ sinStockCount }}</p>
        </div>
      </div>
 
    </div>


    <main class="p-6 flex-1 overflow-y-auto">
      <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
        <div
          *ngFor="let item of prodFiltrados"
          class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition"
        >
          <!-- Imagen del producto -->
          <div class="h-44 w-full bg-gray-100">
            <img [src]="item.imagen" alt="{{ item.nombreProducto }}" class="w-full h-full object-cover" />
          </div>

          <!-- Contenido -->
          <div class="p-5 space-y-3 text-sm text-gray-700">
            <h3 class="text-lg font-semibold text-gray-800 truncate flex items-center gap-2">
              <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" stroke-width="2"
                   viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
              </svg>
              {{ item.nombreProducto }}
            </h3>

            <p class="flex items-start gap-2">
              <svg class="w-4 h-4 mt-0.5 text-gray-500" fill="none" stroke="currentColor" stroke-width="1.5"
                   viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M9 12h6m-6 4h6m-3-12a9 9 0 100 18 9 9 0 000-18z" />
              </svg>
              <span class="font-medium">Descripción:</span>
              <span class="truncate">{{ item.descripcion }}</span>
            </p>

            <p class="flex items-center gap-2">
              <svg class="w-4 h-4 text-green-600" fill="none" stroke="currentColor" stroke-width="1.5"
                   viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3" />
              </svg>
              <span class="font-medium">Precio:</span> L {{ item.precio }}
            </p>

            <p class="flex items-center gap-2">
              <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" stroke-width="1.5"
                   viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M3 14h18M5 6h14v12H5z" />
              </svg>
              <span class="font-medium">Stock:</span> {{ item.cantidadEnStock }}
            </p>

            <div class="text-center font-medium py-1 rounded text-sm"
                 [ngClass]="{
                    'bg-green-100 text-green-700': item.estado === 'Activo',
                    'bg-red-100 text-red-700': item.estado === 'Inactivo'
                  }">
              {{ item.estado }}
            </div>

            <button
              *ngIf="isAdmin"
              [routerLink]="['/productos/edit', item._id]"
              class="w-full mt-3 bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg font-semibold transition"
            >
              Editar
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
