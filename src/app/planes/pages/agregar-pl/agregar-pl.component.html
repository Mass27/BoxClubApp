<div class="min-h-screen bg-gray-100 py-10 px-4 flex justify-center items-start">
  <div class="w-full max-w-4xl bg-white rounded-3xl shadow-xl p-10 relative overflow-hidden">

    <!-- Encabezado visual -->
    <div class="text-center mb-10">
      <h2 class="text-4xl font-extrabold text-red-600 tracking-tight">
        {{ planeId ? 'Editar Plan' : 'Registrar Nuevo Plan' }}
      </h2>
      <p class="text-gray-600 mt-2 text-lg">Completa la información del plan</p>
    </div>

    <!-- Formulario -->
    <form [formGroup]="formulario" class="grid grid-cols-1 md:grid-cols-2 gap-8 text-base">

      <!-- Nombre de Plan -->
      <div>
        <label for="nombrePlan" class="block text-gray-700 font-semibold mb-1">
          Nombre del Plan <span class="text-red-500">*</span>
        </label>
        <input
          formControlName="nombrePlan"
          id="nombrePlan"
          type="text"
          placeholder="Ej: Plan Mensual"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-red-400"
        />
        <div *ngIf="formulario.get('nombrePlan')?.invalid && formulario.get('nombrePlan')?.touched">
          <small class="text-red-500">Campo obligatorio.</small>
        </div>
      </div>

      <!-- Descripción -->
      <div>
        <label for="descripcion" class="block text-gray-700 font-semibold mb-1">
          Descripción <span class="text-red-500">*</span>
        </label>
        <input
          formControlName="descripcion"
          id="descripcion"
          type="text"
          placeholder="Ej: Acceso ilimitado a máquinas"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-red-400"
        />
        <div *ngIf="formulario.get('descripcion')?.invalid && formulario.get('descripcion')?.touched">
          <small class="text-red-500">Campo obligatorio.</small>
        </div>
      </div>

      <!-- Precio -->
      <div>
        <label for="precio" class="block text-gray-700 font-semibold mb-1">
          Precio <span class="text-red-500">*</span>
        </label>
        <input
          formControlName="precio"
          id="precio"
          type="number"
          (input)="limitarInput($event)"
          placeholder="Ej: 500"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-red-400"
        />
        <div *ngIf="formulario.get('precio')?.invalid && formulario.get('precio')?.touched">
          <small class="text-red-500">Campo obligatorio.</small>
        </div>
      </div>

      <!-- Días -->
      <div>
        <label for="dias" class="block text-gray-700 font-semibold mb-1">
          Días <span class="text-red-500">*</span>
        </label>
        <input
          formControlName="dias"
          id="dias"
          type="number"
          (input)="limitarInput($event)"
          placeholder="Ej: 30"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-red-400"
        />
        <div *ngIf="formulario.get('dias')?.invalid && formulario.get('dias')?.touched">
          <small class="text-red-500">Campo obligatorio.</small>
        </div>
      </div>
    </form>

    <!-- Botón guardar -->
    <div class="text-center mt-10">
      <button
        type="submit"
        (click)="enviarForm()"
        class="w-full md:w-auto px-10 py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-full shadow-lg text-lg transition-transform transform hover:scale-105"
      >
        {{ planeId ? 'Actualizar Plan' : 'Guardar Plan' }}
      </button>
    </div>
  </div>
</div>
