<div class="flex justify-center mt-8">
  <div class="max-w-2xl w-full">
    <form [formGroup]="formulario" class="bg-white rounded-2xl shadow-lg p-6 md:p-10">
      <h2 class="text-2xl font-bold text-red-600 mb-6 text-center">
        {{ planeId ? 'Editar Plan' : 'Agregar Plan' }}
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Nombre de Plan -->
        <div>
          <label for="nPlan" class="block text-sm font-semibold text-gray-700 mb-2">
            <span class="inline-block align-middle mr-1">
              <!-- Tag Icon -->
              <svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M3 11l9 9a2 2 0 002.83 0l7.07-7.07a2 2 0 000-2.83l-9-9a2 2 0 00-2.83 0L3 8.17a2 2 0 000 2.83z"/>
              </svg>
            </span>
            Nombre de Plan <span class="text-red-500">*</span>
          </label>
          <input
            formControlName="nombrePlan"
            type="text"
            id="nPlan"
            placeholder="Nombre del Plan"
            class="w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-2 text-base focus:border-red-400 focus:ring-2 focus:ring-red-100 outline-none transition"
          />
          <div *ngIf="formulario.get('nombrePlan')?.invalid && formulario.get('nombrePlan')?.touched">
            <small class="text-red-500">Nombre del plan es requerido.</small>
          </div>
        </div>

        <!-- Descripción -->
        <div>
          <label for="desc" class="block text-sm font-semibold text-gray-700 mb-2">
            <span class="inline-block align-middle mr-1">
              <!-- Description Icon -->
              <svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <rect x="4" y="4" width="16" height="16" rx="2"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 9h8M8 13h6M8 17h4"/>
              </svg>
            </span>
            Descripción <span class="text-red-500">*</span>
          </label>
          <input
            formControlName="descripcion"
            type="text"
            id="desc"
            placeholder="Descripción"
            class="w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-2 text-base focus:border-red-400 focus:ring-2 focus:ring-red-100 outline-none transition"
          />
          <div *ngIf="formulario.get('descripcion')?.invalid && formulario.get('descripcion')?.touched">
            <small class="text-red-500">Descripción del plan es requerido.</small>
          </div>
        </div>

        <!-- Precio -->
        <div>
          <label for="precio" class="block text-sm font-semibold text-gray-700 mb-2">
            <span class="inline-block align-middle mr-1">
              <!-- Money Icon -->
              <svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 1.343-3 3s1.343 3 3 3 3-1.343 3-3"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2m0 14v2m9-9h-2M5 12H3"/>
              </svg>
            </span>
            Precio <span class="text-red-500">*</span>
          </label>
          <input
            formControlName="precio"
            (input)="limitarInput($event)"
            type="number"
            id="precio"
            placeholder="Precio"
            class="w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-2 text-base focus:border-red-400 focus:ring-2 focus:ring-red-100 outline-none transition"
          />
          <div *ngIf="formulario.get('precio')?.invalid && formulario.get('precio')?.touched">
            <small class="text-red-500">Precio del plan es requerido.</small>
          </div>
        </div>

        <!-- Días -->
        <div>
          <label for="dias" class="block text-sm font-semibold text-gray-700 mb-2">
            <span class="inline-block align-middle mr-1">
              <!-- Calendar Icon -->
              <svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <rect width="18" height="18" x="3" y="4" rx="2" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 2v4M8 2v4M3 10h18"/>
              </svg>
            </span>
            Días <span class="text-red-500">*</span>
          </label>
          <input
            formControlName="dias"
            (input)="limitarInput($event)"
            type="number"
            id="dias"
            placeholder="Cantidad de días"
            class="w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-2 text-base focus:border-red-400 focus:ring-2 focus:ring-red-100 outline-none transition"
          />
          <div *ngIf="formulario.get('dias')?.invalid && formulario.get('dias')?.touched">
            <small class="text-red-500">Cantidad de días es requerido.</small>
          </div>
        </div>
      </div>

      <!-- Botón Guardar -->
      <div class="pt-6">
        <button
          type="submit"
          (click)="enviarForm()"
          class="w-full bg-gradient-to-r from-red-500 to-red-700 hover:from-red-600 hover:to-red-800 text-white font-bold py-3 rounded-xl shadow-lg transition text-lg tracking-wide"
        >
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>
