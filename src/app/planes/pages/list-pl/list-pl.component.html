<h2 class="titulo-global">Listado de Planes</h2>

<div class="search-container">
 
<app-searchBox
  (BuscarObject)="buscarPlanesPorNombre($event)"
  >
  </app-searchBox>
  <button *ngIf="isAdmin" class="button-agregar" routerLink="/planes/agregar">AGREGAR</button>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mt-8">
  <div *ngFor="let item of planesFiltrado" class="bg-white rounded-2xl shadow-md p-6 hover:shadow-lg transition-shadow duration-300 flex flex-col h-full">
    <div class="space-y-4 flex-grow">
      <h2 class="text-2xl font-bold text-gray-800">{{ item.nombrePlan }}</h2>
      
      <p class="text-3xl font-semibold text-gray-900">
        {{ item.precio | currency:'HNL':'symbol':'1.0-2' }}
      </p>
      
      <div class="border-t border-gray-200 pt-4 space-y-3">
        <div class="text-sm text-gray-600">
          <p class="font-medium text-gray-700">Descripción:</p>
          <p class="break-words mt-1">{{ item.descripcion }}</p>
        </div>
        
        <p class="text-sm text-gray-600 flex justify-between">
          <span class="text-gray-700">Días:</span>
          <span class="font-medium">{{ item.dias }}</span>
        </p>
      </div>
    </div>

    <div class="mt-6">
      <button *ngIf="isAdmin"
              [routerLink]="['/planes/edit', item._id]"
              class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-4 rounded-lg transition-colors duration-300">
        Editar Plan
      </button>
    </div>
  </div>
</div>
