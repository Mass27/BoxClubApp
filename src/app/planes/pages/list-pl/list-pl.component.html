<div class="min-h-screen bg-gray-100 p-4">
  <!-- Encabezado -->
  <div class="mb-6 flex flex-col md:flex-row items-center justify-between gap-4">
    <h2 class="text-2xl font-bold text-red-600 flex items-center gap-2">
      <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
      </svg>
      Panel de Planes
    </h2>

    <div class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
      <app-searchBox
        (BuscarObject)="buscarPlanesPorNombre($event)"
        class="w-full sm:w-auto"
      ></app-searchBox>

      <button
        *ngIf="isAdmin"
        routerLink="/planes/agregar"
        class="flex items-center gap-2 bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md transition"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
        Agregar
      </button>
    </div>
  </div>

  <!-- Cards -->
  <div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
    <div
      *ngFor="let item of planesFiltrado"
      class="bg-white rounded-lg shadow-sm hover:shadow-md transition flex flex-col"
    >
      <div class="p-4 flex-1 flex flex-col justify-between">
        <!-- Nombre del plan -->
        <h3 class="text-xl font-semibold text-gray-800 flex items-center gap-2 mb-2">
          <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20 13V7a2 2 0 00-2-2h-2V4a1 1 0 00-2 0v1H10V4a1 1 0 00-2 0v1H6a2 2 0 00-2 2v6" />
          </svg>
          {{ item.nombrePlan }}
        </h3>

        <!-- Precio -->
        <p class="text-2xl font-bold text-green-600 flex items-center gap-1 mb-4">
          <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3" />
          </svg>
          {{ item.precio | currency:'HNL':'symbol':'1.0-2' }}
        </p>

        <!-- Descripción y Días -->
        <div class="text-sm text-gray-600 space-y-3 border-t border-gray-200 pt-3">
          <p class="flex items-start gap-2">
            <svg class="w-4 h-4 mt-0.5 text-gray-500" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16h6" />
            </svg>
            <strong>Descripción:</strong> {{ item.descripcion | slice:0:30 }}...
          </p>

          <p class="flex items-center gap-2">
            <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3M3 11h18M5 19h14" />
            </svg>
            <span class="font-medium">Días:</span> {{ item.dias }}
          </p>
        </div>
      </div>

      <!-- Botón de editar -->
      <button
        *ngIf="isAdmin"
        [routerLink]="['/planes/edit', item._id]"
        class="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded-b-lg font-medium transition"
      >
        Editar
      </button>
    </div>
  </div>
</div>
