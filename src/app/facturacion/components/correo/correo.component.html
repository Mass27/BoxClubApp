<h2 mat-dialog-title>Enviar factura</h2>

<mat-dialog-content>
  <mat-form-field appearance="fill" class="w-full">
    <mat-label>Correo electrónico</mat-label>
    <input matInput [(ngModel)]="correo" type="email" required>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cerrar()">Cancelar</button>
  <button mat-button color="primary" [disabled]="!correo || correo.trim() === ''" (click)="enviar()">Enviar</button>
</mat-dialog-actions>
