<div class="min-h-screen bg-gray-50 py-10 px-4 flex justify-center items-start">
  <div class="w-full max-w-4xl bg-white rounded-3xl shadow-xl p-10 relative overflow-hidden">
    
    <!-- Encabezado -->
    <div class="text-center mb-10">
      <h2 class="text-4xl font-extrabold text-red-600 tracking-tight">
        {{ empleadoId ? 'Editar Empleado' : 'Registrar Nuevo Empleado' }}
      </h2>
      <p class="text-gray-600 mt-2 text-lg">Completa la información del empleado</p>
    </div>

    <!-- Formulario -->
    <form [formGroup]="formulario" class="grid grid-cols-1 md:grid-cols-2 gap-8 text-base">
      
      <!-- Identidad -->
      <div>
        <label for="identidad" class="block text-gray-700 font-semibold mb-1">
          Identidad <span class="text-red-500">*</span>
        </label>
        <input
          formControlName="identidad"
          type="text"
          id="identidad"
          maxlength="13"
          (input)="limitarIdentidad($event)"
          placeholder="0801199912345"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-red-400"
        />
        <div *ngIf="formulario.get('identidad')?.invalid && formulario.get('identidad')?.touched">
          <small class="text-red-500">Debe tener 13 dígitos numéricos.</small>
        </div>
      </div>

      <!-- Nombre Completo -->
      <div>
        <label for="nombreCompleto" class="block text-gray-700 font-semibold mb-1">
          Nombre Completo <span class="text-red-500">*</span>
        </label>
        <input
          formControlName="nombreCompleto"
          type="text"
          id="nombreCompleto"
          placeholder="Juan Pérez"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-red-400"
        />
        <div *ngIf="formulario.get('nombreCompleto')?.invalid && formulario.get('nombreCompleto')?.touched">
          <small class="text-red-500">Campo obligatorio.</small>
        </div>
      </div>

      <!-- Correo -->
      <div>
        <label for="correo" class="block text-gray-700 font-semibold mb-1">
          Correo Electrónico <span class="text-red-500">*</span>
        </label>
        <input
          formControlName="correo"
          type="email"
          id="correo"
          placeholder="correo@ejemplo.com"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-red-400"
        />
        <div *ngIf="formulario.get('correo')?.invalid && formulario.get('correo')?.touched">
          <small class="text-red-500">Correo inválido.</small>
        </div>
      </div>

      <!-- Teléfono -->
      <div>
        <label for="telefono" class="block text-gray-700 font-semibold mb-1">
          Teléfono <span class="text-red-500">*</span>
        </label>
        <input
          formControlName="numeroTelefono"
          type="text"
          id="telefono"
          maxlength="8"
          (input)="limitarNumeroTelefono($event)"
          placeholder="98765432"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-red-400"
        />
        <div *ngIf="formulario.get('numeroTelefono')?.invalid && formulario.get('numeroTelefono')?.touched">
          <small class="text-red-500">Campo obligatorio.</small>
        </div>
      </div>

      <!-- Tipo de Empleado -->
      <div class="md:col-span-2">
        <label for="tipoEmpleado" class="block text-gray-700 font-semibold mb-1">
          Tipo de Empleado <span class="text-red-500">*</span>
        </label>
        <select
          formControlName="tipoEmpleado"
          id="tipoEmpleado"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-red-400"
        >
          <option value="" disabled selected>Seleccione una opción</option>
          <option value="entrenador">Entrenador</option>
          <option value="administrativo">Administrativo</option>
          <option value="conserje">Conserje</option>
        </select>
        <div *ngIf="formulario.get('tipoEmpleado')?.invalid && formulario.get('tipoEmpleado')?.touched">
          <small class="text-red-500">Seleccione un tipo válido.</small>
        </div>
      </div>

      <!-- Botón -->
      <div class="md:col-span-2 text-center mt-6">
        <button
          type="submit"
          (click)="enviarForm()"
          class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-10 rounded-full shadow-lg transition-transform transform hover:scale-105"
        >
          {{ empleadoId ? 'Actualizar' : 'Registrar' }}
        </button>
      </div>
    </form>
  </div>
</div>
