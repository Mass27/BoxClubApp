<div class="min-h-screen bg-gray-50 py-8">
  <form [formGroup]="rutinaForm" (ngSubmit)="enviarForm()" class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
    <!-- Header -->
    <div class="bg-gradient-to-r from-red-600 to-red-800 px-8 py-6">
      <h2 class="text-2xl font-bold text-white">  <span>{{ rutinaId ? "Editar Rutina" : "Registrar Rutina" }}</span></h2>
      <p class="text-blue-100 mt-1">Crea o modifica rutinas de entrenamiento</p>
    </div>

    <div class="p-8">
      <!-- Información básica -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Nombre De La Rutina*</label>
          <input formControlName="nombre" placeholder="ej: Rutina de boxeo principiantes"
                 class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Descripción*</label>
          <input formControlName="descripcion" placeholder="Breve descripción de la rutina"
                 class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Fecha de Inicio*</label>
          <input type="date" formControlName="fechaInicio"
                 class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Fecha de Fin*</label>
          <input type="date" formControlName="fechaFin"
                 class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200" />
        </div>

        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-2">Entrenador Asignado*</label>
          <select formControlName="empleado"
                  class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200">
            <option value="" disabled selected>Selecciona un entrenador</option>
            <option *ngFor="let emp of empleados" [value]="emp._id">
              {{ emp.nombreCompleto }}
            </option>
          </select>
        </div>
      </div>

      <!-- Ejercicios -->
     <div formArrayName="ejercicios" class="space-y-6">
  <div class="flex items-center justify-between mb-4">
    <h3 class="text-lg font-semibold text-gray-900">Ejercicios</h3>
    <button type="button" (click)="agregarEjercicio()"
            class="flex items-center px-4 py-2 bg-red-100 text-red-700 rounded-lg hover:bg-red-200 transition-all duration-200">
      <span class="material-icons mr-2">add_circle</span>
      Agregar ejercicio
    </button>
  </div>
<div class="max-h-[500px] overflow-y-auto pr-4 space-y-4 scrollbar-thin scrollbar-thumb-blue-500 scrollbar-track-blue-100">
        <div *ngFor="let ejercicio of ejercicios.controls; let i = index" [formGroupName]="i"
             class="p-6 bg-gray-50 rounded-xl border border-gray-200 hover:shadow-md transition-all duration-200">
          <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-gray-700 mb-2">Nombre del Ejercicio</label>
              <input formControlName="nombre" placeholder="ej: Jab-Cross combinación"
                     class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Repeticiones</label>
              <input formControlName="repeticiones" type="number" min="1"
                     class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Series</label>
              <input formControlName="series" type="number" min="1"
                     class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
            </div>
            <div class="md:col-span-4">
              <label class="block text-sm font-medium text-gray-700 mb-2">Descanso</label>
              <input formControlName="descanso" placeholder="ej: 30 segundos entre series"
                     class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
            </div>
          </div>
          <button (click)="eliminarEjercicio(i)" type="button"
                  class="mt-4 flex items-center px-4 py-2 text-red-600 hover:bg-red-50 rounded-lg transition-all duration-200">
            <span class="material-icons mr-2">delete</span>
            Eliminar ejercicio
          </button>
        </div>
      </div>
</div>
      <!-- Botón guardar -->
      <div class="mt-8 flex justify-end">
        <button type="submit"
                class="px-8 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 focus:ring-4 focus:ring-red-200 transition-all duration-200 flex items-center">
          <span class="material-icons mr-2">save</span>
          Guardar Rutina
        </button>
      </div>
    </div>
  </form>
</div>
