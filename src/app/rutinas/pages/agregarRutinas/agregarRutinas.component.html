<div class="min-h-screen bg-gradient-to-br from-gray-100 to-white py-12 px-6">
  <form [formGroup]="rutinaForm" (ngSubmit)="enviarForm()" class="max-w-6xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden border border-red-100">
    
    <!-- ENCABEZADO -->
    <div class="bg-gradient-to-r from-red-700 to-red-500 px-10 py-8 text-white">
      <h2 class="text-3xl font-extrabold tracking-wide">
        {{ rutinaId ? "Editar Rutina" : "Registrar Rutina" }}
      </h2>
      <p class="text-sm mt-1 opacity-90">Administra rutinas de entrenamiento para tus clientes</p>
    </div>

    <div class="p-10 space-y-10">

      <!-- DATOS PRINCIPALES -->
      <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
        <div>
          <label class="block font-semibold text-gray-700 mb-1">Nombre de la Rutina <span class="text-red-500">*</span></label>
          <input formControlName="nombre" placeholder="Ej: Rutina de resistencia"
                 class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-gray-50 focus:ring-2 focus:ring-red-400" />
        </div>

        <div>
          <label class="block font-semibold text-gray-700 mb-1">Descripción <span class="text-red-500">*</span></label>
          <input formControlName="descripcion" placeholder="Ej: Ejercicios de boxeo para principiantes"
                 class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-gray-50 focus:ring-2 focus:ring-red-400" />
        </div>

        <div>
          <label class="block font-semibold text-gray-700 mb-1">Entrenador Asignado <span class="text-red-500">*</span></label>
          <select formControlName="empleado"
                  class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-gray-50 focus:ring-2 focus:ring-red-400">
            <option value="" disabled selected>Selecciona un entrenador</option>
            <option *ngFor="let emp of empleados" [value]="emp._id">
              {{ emp.nombreCompleto }}
            </option>
          </select>
        </div>

        <div>
          <label class="block font-semibold text-gray-700 mb-1">Fecha de Inicio <span class="text-red-500">*</span></label>
          <input type="date" formControlName="fechaInicio"
                 class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-gray-50 focus:ring-2 focus:ring-red-400" />
        </div>

        <div>
          <label class="block font-semibold text-gray-700 mb-1">Fecha de Fin <span class="text-red-500">*</span></label>
          <input type="date" formControlName="fechaFin"
                 class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-gray-50 focus:ring-2 focus:ring-red-400" />
        </div>
      </div>

      <!-- EJERCICIOS -->
      <div formArrayName="ejercicios">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-xl font-bold text-gray-800">Ejercicios de la Rutina</h3>
          <button type="button" (click)="agregarEjercicio()"
                  class="flex items-center gap-2 bg-red-100 text-red-700 px-4 py-2 rounded-lg hover:bg-red-200 transition">
            <span class="material-icons">add_circle</span> Agregar
          </button>
        </div>

        <div class="grid gap-6 max-h-[480px] overflow-y-auto pr-2 custom-scroll">
          <div *ngFor="let ejercicio of ejercicios.controls; let i = index" [formGroupName]="i"
               class="p-6 bg-white rounded-2xl border border-gray-200 shadow hover:shadow-lg transition">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
              <div class="md:col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del Ejercicio</label>
                <input formControlName="nombre" placeholder="Ej: Jab-Cross"
                       class="w-full px-4 py-2 rounded-lg border border-gray-300 bg-gray-50 focus:ring-2 focus:ring-red-400" />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Repeticiones</label>
                <input formControlName="repeticiones" type="number" min="1"
                       class="w-full px-4 py-2 rounded-lg border border-gray-300 bg-gray-50 focus:ring-2 focus:ring-red-400" />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Series</label>
                <input formControlName="series" type="number" min="1"
                       class="w-full px-4 py-2 rounded-lg border border-gray-300 bg-gray-50 focus:ring-2 focus:ring-red-400" />
              </div>
              <div class="md:col-span-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Descanso</label>
                <input formControlName="descanso" placeholder="Ej: 30 segundos"
                       class="w-full px-4 py-2 rounded-lg border border-gray-300 bg-gray-50 focus:ring-2 focus:ring-red-400" />
              </div>
            </div>
            <div class="flex justify-end mt-4">
              <button type="button" (click)="eliminarEjercicio(i)"
                      class="flex items-center gap-2 text-red-600 hover:text-white hover:bg-red-500 px-4 py-2 rounded-lg border border-red-200 bg-red-50 hover:border-transparent transition">
                <span class="material-icons">delete</span> Eliminar
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- BOTÓN GUARDAR -->
      <div class="flex justify-end pt-6 border-t border-gray-200">
        <button type="submit"
                class="flex items-center gap-2 bg-gradient-to-r from-red-600 to-red-700 hover:from-red-700 hover:to-red-800 text-white px-6 py-3 rounded-xl text-lg shadow-md transition">
          <span class="material-icons">save</span> Guardar Rutina
        </button>
      </div>
    </div>
  </form>
</div>
