    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
    </svg>
    Agregar Rutina
  </button>
</div>

<div class="bg-white rounded-xl shadow-xl p-6 overflow-auto mx-4 border border-red-100">

  <!-- TÍTULO -->
  <h2 class="text-2xl font-extrabold text-red-600 mb-6 flex items-center gap-2">
    <mat-icon color="warn">fitness_center</mat-icon> Rutinas Registradas
  </h2>

  <!-- TABLA -->
  <table mat-table [dataSource]="dataSource" matSort class="w-full border-separate border-spacing-y-3">

    <!-- NOMBRE -->
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-left text-red-600 font-bold text-sm px-4 pb-2">
        Nombre
      </th>
      <td mat-cell *matCellDef="let rutina" class="bg-red-50 px-4 py-3 rounded-l-xl rounded-r-none shadow-sm">
        {{ rutina.nombre }}
      </td>
    </ng-container>

    <!-- DESCRIPCIÓN -->
    <ng-container matColumnDef="descripcion">
      <th mat-header-cell *matHeaderCellDef class="text-left text-red-600 font-bold text-sm px-4 pb-2">
        Descripción
      </th>
      <td mat-cell *matCellDef="let rutina" class="bg-red-50 px-4 py-3 shadow-sm">
        {{ rutina.descripcion.length > 80 ? (rutina.descripcion | slice:0:80) + '...' : rutina.descripcion }}
      </td>
    </ng-container>

    <!-- EMPLEADO -->
    <ng-container matColumnDef="empleado">
      <th mat-header-cell *matHeaderCellDef class="text-left text-red-600 font-bold text-sm px-4 pb-2">
        Empleado
      </th>
      <td mat-cell *matCellDef="let rutina" class="bg-red-50 px-4 py-3 shadow-sm">
        {{ getempleadoName(rutina.empleado) }}
      </td>
    </ng-container>

    <!-- ACCIONES -->
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef class="text-center text-red-600 font-bold text-sm px-4 pb-2">
        Acciones
      </th>
      <td mat-cell *matCellDef="let rutina" class="bg-red-50 px-4 py-3 rounded-r-xl flex justify-center gap-2 shadow-sm">
        <button mat-raised-button color="warn" [routerLink]="['/rutinas/edit', rutina._id]">
          <mat-icon class="text-white text-sm">edit</mat-icon> Editar
        </button>
        <button mat-stroked-button color="primary" (click)="downloadPDF(rutina._id)">
          <mat-icon class="text-blue-600 text-sm">download</mat-icon> PDF
        </button>
      </td>
    </ng-container>

    <!-- CABECERAS -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <!-- PAGINADOR -->
  <mat-paginator
    class="mt-6 border-t pt-4"
    [pageSizeOptions]="[5, 10, 20]"
    showFirstLastButtons
  ></mat-paginator>
</div>
